name: Notifier regression check

on:
  workflow_dispatch:
    inputs:
      delivery_json:
        description: Bounded official-plugin result batch, empty runs offline tests only
        required: false
        default: ""
        type: string
      initialize_delivery_state:
        description: Initialize the delivery ledger only for the first ever relay run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: official-upwork-result-delivery
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -q
      - name: Restore delivery receipts
        if: inputs.delivery_json != ''
        id: delivery-state
        uses: actions/cache/restore@v4
        with:
          path: official-delivery.sqlite3
          key: official-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-delivery-v1-
      - name: Require existing ledger after bootstrap
        if: inputs.delivery_json != '' && steps.delivery-state.outputs.cache-matched-key == '' && !inputs.initialize_delivery_state
        run: |
          echo 'Delivery ledger is missing. Reconcile prior receipts before initializing it.' >&2
          exit 1
      - name: Prepare and preview official results
        if: inputs.delivery_json != ''
        env:
          DELIVERY_JSON: ${{ inputs.delivery_json }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ['DELIVERY_JSON']
          if len(raw) > 60000:
              raise SystemExit('Use a smaller bounded result batch')
          path = Path('/tmp/upwork-official-batch.json')
          path.write_text(raw)
          path.chmod(0o600)
          PY
          python official_bridge.py --input /tmp/upwork-official-batch.json > /tmp/upwork-preview.json
      - name: Deliver to configured owner bot and tracker
        if: inputs.delivery_json != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_API_URL: ${{ vars.TRACKER_API_URL }}
          TRACKER_API_TOKEN: ${{ secrets.TRACKER_API_TOKEN }}
        run: python official_bridge.py --input /tmp/upwork-official-batch.json --deliver
      - name: Preserve receipts including uncertain sends
        if: always() && inputs.delivery_json != ''
        uses: actions/cache/save@v4
        with:
          path: official-delivery.sqlite3
          key: official-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove temporary account data
        if: always()
        run: rm -f /tmp/upwork-official-batch.json /tmp/upwork-preview.json
